if (!function_exists('reevio_nav_link_class')) {
    function reevio_nav_link_class(string $key, string $activeNav): string
    {
        $base = 'flex items-center gap-4 rounded-lg px-2 py-2.5 transition-colors';

        if ($key === $activeNav) {
            return $base . ' bg-surface-variant/60 font-bold text-primary';
        }

        return $base . ' text-on-surface hover:bg-surface-container-low';
    }
}

if (!function_exists('reevio_nav_icon_class')) {
    function reevio_nav_icon_class(string $key, string $activeNav): string
    {
        if ($key === $activeNav) {
            return 'material-symbols-outlined text-xl text-primary';
        }

        return 'material-symbols-outlined text-xl text-on-surface-variant';
    }
}

if (!function_exists('reevio_nav_label_class')) {
    function reevio_nav_label_class(string $key, string $activeNav): string
    {
        if ($key === $activeNav) {
            return 'font-label text-sm';
        }

        return 'font-label text-sm font-medium';
    }
}

if (!function_exists('reevio_nav_avatar')) {
    function reevio_nav_avatar(?array $user): string
    {
        if ($user && !empty($user['avatar_url'])) {
            return '<img src="' . htmlspecialchars((string) $user['avatar_url'], ENT_QUOTES, 'UTF-8') . '" alt="Account avatar" class="h-7 w-7 rounded-full object-cover" />';
        }

        return '<span class="material-symbols-outlined">account_circle</span>';
    }
}
