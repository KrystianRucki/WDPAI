if (!function_exists('reevio_public_watch_e')) {
    function reevio_public_watch_e($value): string
    {
        return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8');
    }
}

if (!function_exists('reevio_public_watch_count')) {
    function reevio_public_watch_count($value): string
    {
        return number_format((int) $value, 0, '.', ' ');
    }
}

if (!function_exists('reevio_public_watch_poster')) {
    function reevio_public_watch_poster(array $film): string
    {
        return !empty($film['poster_url']) ? (string) $film['poster_url'] : '/public/assets/img/movie_placeholder.svg';
    }
}

if (!function_exists('reevio_public_watch_runtime')) {
    function reevio_public_watch_runtime($minutes): string
    {
        $minutes = (int) $minutes;

        if ($minutes <= 0) {
            return '';
        }

        $hours = intdiv($minutes, 60);
        $rest = $minutes % 60;

        if ($hours <= 0) {
            return $rest . 'm';
        }

        return $hours . 'h ' . str_pad((string) $rest, 2, '0', STR_PAD_LEFT) . 'm';
    }
}
