<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Cinematic Lens - 404 Error</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/public/assets/css/reevio.css" rel="stylesheet" /></head>
  <body
    class="font-body antialiased flex h-screen overflow-hidden selection:bg-primary selection:text-on-primary reevio-page-not_found"
  >
    <!-- 404 Canvas (No Navigation due to transactional/error context rule) -->
    <main
      class="relative z-10 h-full flex flex-col items-center justify-center px-8 text-center w-full"
    >
      <div
        class="glass-card w-[480px] rounded-3xl border border-outline-variant/20 px-6 py-10 shadow-[0_20px_40px_rgba(0,0,0,0.45)] bg-surface-container-low/60 backdrop-blur-xl"
      >
        <div
          class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center"
        >
          <div
            class="absolute inset-0 rounded-full border border-primary/30 pulse-ring"
          ></div>

          <div
            class="relative w-28 h-28 rounded-full bg-surface-container-lowest flex items-center justify-center border border-outline-variant/20 shadow-[0_0_30px_rgba(255,215,155,0.08)]"
          >
            <span
              class="material-symbols-outlined text-[#ffd79b] text-6xl reevio-inline-style-001"
             
              >movie_off</span
            >
          </div>
        </div>
        <p
          class="font-label text-xs uppercase tracking-[0.3em] text-secondary mb-3"
        >
          Error 404
        </p>
        <h2
          class="font-headline font-black text-4xl tracking-tight text-on-surface mb-4"
        >
          Scene not found
        </h2>
        <p class="text-on-surface-variant text-sm leading-relaxed mb-8">
          The page you’re looking for may have been moved, deleted, or never
          made it past the opening credits.
        </p>
        <div class="flex flex-row gap-3 justify-center">
          <button
            class="px-8 py-3.5 rounded-full bg-gradient-to-r from-[#ffd79b] to-[#ffb300] text-[#281900] font-headline font-bold tracking-wide shadow-[0_10px_20px_rgba(255,215,155,0.18)] hover:scale-[1.02] active:scale-95 transition-transform flex items-center justify-center gap-2"
          >
            <span
              class="material-symbols-outlined reevio-inline-style-001"
             
              >home</span
            >
            Go Home
          </button>
          <button
            class="px-8 py-3.5 rounded-full border border-secondary/40 text-secondary font-label font-bold tracking-wide hover:bg-secondary/10 active:scale-95 transition-all flex items-center justify-center gap-2"
          >
            <span class="material-symbols-outlined">search</span>
            Search Films
          </button>
        </div>
      </div>
    </main>
      <script src="/public/assets/js/reevio.js"></script>
</body>
</html>
