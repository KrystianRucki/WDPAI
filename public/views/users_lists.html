if (!function_exists('reevio_lists_e')) {
    function reevio_lists_e($value): string
    {
        return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8');
    }
}

if (!function_exists('reevio_lists_count')) {
    function reevio_lists_count($value): string
    {
        return number_format((int) $value, 0, '.', ' ');
    }
}

if (!function_exists('reevio_lists_poster')) {
    function reevio_lists_poster($value): string
    {
        return !empty($value) ? (string) $value : '/public/assets/img/movie_placeholder.svg';
    }
}

if (!function_exists('reevio_lists_date')) {
    function reevio_lists_date($date): string
    {
        if (!$date) {
            return 'Recently';
        }

        try {
            return (new DateTimeImmutable((string) $date))->format('M j, Y');
        } catch (Throwable) {
            return 'Recently';
        }
    }
}
