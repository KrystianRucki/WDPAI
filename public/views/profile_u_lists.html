if (!function_exists('reevio_public_lists_e')) {
    function reevio_public_lists_e($value): string
    {
        return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8');
    }
}

if (!function_exists('reevio_public_lists_count')) {
    function reevio_public_lists_count($value): string
    {
        return number_format((int) $value, 0, '.', ' ');
    }
}

if (!function_exists('reevio_public_lists_posters')) {
    function reevio_public_lists_posters(array $list): array
    {
        $posters = [];

        foreach (['poster_1', 'poster_2', 'poster_3'] as $key) {
            if (!empty($list[$key])) {
                $posters[] = (string) $list[$key];
            }
        }

        while (count($posters) < 3) {
            $posters[] = '/public/assets/img/movie_placeholder.svg';
        }

        return $posters;
    }
}
