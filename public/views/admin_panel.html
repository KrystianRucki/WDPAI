    <script src="/public/assets/js/reevio.js"></script>
    <script>
      const usersPerPage = 10;
      let currentPage = 1;
      let searchTerm = "";
      let lastPayload = null;

      const listEl = document.getElementById("admin-users-list");
      const searchEl = document.getElementById("admin-user-search");
      const totalEl = document.getElementById("admin-total-users");
      const activeEl = document.getElementById("admin-active-users");
      const blockedEl = document.getElementById("admin-blocked-users");
      const pageLabelEl = document.getElementById("admin-page-label");
      const resultsLabelEl = document.getElementById("admin-results-label");
      const prevBtn = document.getElementById("admin-prev-page");
      const nextBtn = document.getElementById("admin-next-page");
      const pageButtonsEl = document.getElementById("admin-page-buttons");

      async function fetchUsers() {
        const params = new URLSearchParams({
          page: String(currentPage),
          limit: String(usersPerPage),
          search: searchTerm
        });

        const response = await fetch(`/api-admin-users?${params.toString()}`);

        if (!response.ok) {
          throw new Error("Could not load users");
        }

        lastPayload = await response.json();
        renderUsers(lastPayload);
      }

      function renderUsers(payload) {
        const users = payload.users || [];
        const pagination = payload.pagination || { page: 1, pages: 1, total: 0 };
        const stats = payload.stats || { total: 0, active: 0, blocked: 0 };

        totalEl.textContent = stats.total;
        activeEl.textContent = stats.active;
        blockedEl.textContent = stats.blocked;

        listEl.innerHTML = users.map((user) => {
          const isBlocked = !user.is_active;
          const initials = user.username
            .split(" ")
            .map((part) => part[0])
            .slice(0, 2)
            .join("");

          return `
            <article class="admin-user-row ${isBlocked ? "is-blocked" : ""} grid gap-4 px-5 py-4 md:grid-cols-[minmax(0,1.6fr)_minmax(0,1.5fr)_120px_150px] md:items-center">
              <div class="flex min-w-0 items-center gap-4">
                <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-surface-container-high font-headline text-sm font-black text-primary">
                  ${initials}
                </div>
                <div class="min-w-0">
                  <h3 class="truncate font-headline text-base font-black text-on-surface">${user.username}</h3>
                  <p class="truncate font-label text-xs text-secondary">@${user.username}</p>
                </div>
              </div>

              <p class="truncate font-label text-sm text-on-surface-variant">${user.email}</p>

              <span class="admin-status inline-flex w-fit items-center gap-2 rounded-full border ${isBlocked ? "border-error/35 text-error" : "border-secondary/35 text-secondary"} px-3 py-1 font-label text-xs font-bold uppercase tracking-wider">
                <span class="h-2 w-2 rounded-full ${isBlocked ? "bg-error" : "bg-secondary"}"></span>
                ${isBlocked ? "Blocked" : "Active"}
              </span>

              <button
                class="admin-block-button justify-self-start rounded-full border ${isBlocked ? "border-secondary/35 text-secondary hover:bg-secondary/10" : "border-error/35 text-error hover:bg-error/10"} px-4 py-2 font-label text-xs font-bold uppercase tracking-wider md:justify-self-end"
                type="button"
                data-user-id="${user.id}"
                data-blocked="${isBlocked ? "false" : "true"}"
              >
                ${isBlocked ? "Unblock" : "Block"}
              </button>
            </article>
          `;
        }).join("");

        if (!users.length) {
          listEl.innerHTML = `
            <div class="px-5 py-10 text-center">
              <span class="material-symbols-outlined mb-3 text-4xl text-on-surface-variant">search_off</span>
              <p class="font-headline text-lg font-black text-on-surface">No users found</p>
              <p class="mt-1 text-sm text-on-surface-variant">Try a different search phrase.</p>
            </div>
          `;
        }

        const start = pagination.total ? (pagination.page - 1) * usersPerPage + 1 : 0;
        const end = Math.min(start + users.length - 1, pagination.total);
        resultsLabelEl.textContent = `Showing users ${start}-${end} of ${pagination.total}`;
        pageLabelEl.textContent = `Page ${pagination.page} of ${pagination.pages}`;

        prevBtn.disabled = pagination.page <= 1;
        nextBtn.disabled = pagination.page >= pagination.pages;

        pageButtonsEl.innerHTML = Array.from({ length: pagination.pages }, (_, index) => {
          const page = index + 1;
          return `
            <button
              class="h-10 min-w-10 rounded-full px-3 font-label text-sm font-bold transition-colors ${page === pagination.page ? "bg-primary text-on-primary" : "border border-outline-variant/20 text-on-surface-variant hover:border-secondary/40 hover:bg-secondary/10 hover:text-secondary"}"
              type="button"
              data-page="${page}"
            >
              ${page}
            </button>
          `;
        }).join("");
      }

      let searchTimeout = null;
      searchEl.addEventListener("input", (event) => {
        searchTerm = event.target.value;
        currentPage = 1;
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(fetchUsers, 250);
      });

      prevBtn.addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        fetchUsers();
      });

      nextBtn.addEventListener("click", () => {
        const pages = lastPayload?.pagination?.pages || 1;
        currentPage = Math.min(pages, currentPage + 1);
        fetchUsers();
      });

      pageButtonsEl.addEventListener("click", (event) => {
        const pageButton = event.target.closest("[data-page]");
        if (!pageButton) return;
        currentPage = Number(pageButton.dataset.page);
        fetchUsers();
      });

      listEl.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-user-id]");
        if (!button) return;

        const response = await fetch("/api-admin-block-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: Number(button.dataset.userId),
            blocked: button.dataset.blocked === "true"
          })
        });

        if (response.ok) {
          fetchUsers();
        }
      });

      fetchUsers();
    </script>
  </body>
