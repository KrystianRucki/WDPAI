if (!function_exists('reevio_crew_e')) {
    function reevio_crew_e($value): string
    {
        return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8');
    }
}

if (!function_exists('reevio_crew_photo')) {
    function reevio_crew_photo(?array $person): string
    {
        return $person['photo_url'] ?? '/public/assets/img/movie_placeholder.svg';
    }
}

if (!function_exists('reevio_crew_initial')) {
    function reevio_crew_initial($value): string
    {
        return strtoupper(substr((string) $value, 0, 1) ?: 'P');
    }
}

if (!function_exists('reevio_crew_poster')) {
    function reevio_crew_poster(array $film): string
    {
        return !empty($film['poster_url']) ? (string) $film['poster_url'] : '/public/assets/img/movie_placeholder.svg';
    }
}

if (!function_exists('reevio_crew_count')) {
    function reevio_crew_count($value): string
    {
        return number_format((int) $value, 0, '.', ' ');
    }
}

if (!function_exists('reevio_crew_film_href')) {
    function reevio_crew_film_href(array $film): string
    {
        if (!empty($film['id'])) {
            return '/film-details?id=' . (int) $film['id'];
        }

        if (!empty($film['tmdb_id'])) {
            return '/film-details?tmdb_id=' . (int) $film['tmdb_id'];
        }

        return '/search-films';
    }
}
